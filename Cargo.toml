[package]
name = "cargo_jobserver"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"

[profile.release]
opt-level = "z"     # optimize for size
lto = true          # whole-program link-time optimization
codegen-units = 1   # one unit, better cross-function optimization
panic = "abort"     # no unwinding tables or landing pads
strip = true        # strip symbols and debug info
